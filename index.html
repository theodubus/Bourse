<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirection…</title>

    <!-- Redirection immédiate vers la page cible -->
    <meta http-equiv="refresh" content="0; URL='le-guide-de-l&#39;épargne.html'" />

    <!-- Indique l’URL canonique pour les moteurs de recherche -->
    <link rel="canonical" href="le-guide-de-l&#39;épargne.html" />

    <script>
      // Fallback JavaScript si la meta‑refresh est ignorée
      window.location.replace("le-guide-de-l'épargne.html");
    </script>
  </head>
  <body>
    <p>
      Vous allez être redirigé vers
      <a href="le-guide-de-l'épargne.html">le guide de l’épargne</a>.
      Si ce n’est pas le cas, <strong>cliquez sur le lien</strong>.
    </p>
  </body>
</html>
